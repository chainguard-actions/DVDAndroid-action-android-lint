name: Test with lint results containing issues
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: testowner/myrepo
      RUNNER_WORKSPACE: /github/workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          lint_xml_file: pristine/DVDAndroid--action-android-lint/v1.3/tests/fixtures/lint-results-with-issues.xml
          level: warning
          reporter: github-check
          reviewdog_flags: ''

      - name: Assert action ran (converter processed issues, reviewdog may fail due to fake token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The converter should successfully parse the lint XML with issues.
          # Reviewdog will fail due to fake token, so we expect 'failure'.
          # We just verify the action ran (not skipped/cancelled).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected with lint issues (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
