name: Test action fails with missing lint XML file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      RUNNER_WORKSPACE: /github/workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent lint file
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          lint_xml_file: does-not-exist.xml
          level: error
          reporter: github-check

      - name: Assert action failed due to missing file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when lint XML file does not exist, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when lint XML file was missing"
