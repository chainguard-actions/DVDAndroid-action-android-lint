name: Test action with lint XML containing issues
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      RUNNER_WORKSPACE: /github/workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with lint results containing issues
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          lint_xml_file: pristine/DVDAndroid--action-android-lint/v1.1/tests/fixtures/lint-results-with-issues.xml
          level: warning
          reporter: github-check

      - name: Assert action ran (may fail at reviewdog due to auth)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action processes the lint XML and converts it to checkstyle format.
          # It will then fail at reviewdog due to invalid auth token, which is expected.
          # We verify the action ran (not skipped or cancelled).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected with lint issues (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
