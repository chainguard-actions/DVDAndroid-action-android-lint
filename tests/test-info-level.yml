name: Test with info level reporting
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_WORKSPACE: /github/workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          lint_xml_file: tests/fixtures/lint-multi.xml
          level: info
          reporter: local

      - name: Assert action ran (lint issues cause non-zero exit which is expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # When lint issues are found, reviewdog exits 1 (expected behavior).
          # Accept both success and failure — either means the action ran correctly.
          # Only 'skipped' would indicate a problem.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action handled multiple issues at info level correctly with outcome=$OUTCOME"
